[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "anomx"
version = "0.2.98"
description = "Installable time-series anomaly library with forecasting, reconstruction, and representation base approaches."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Theo Rieken" }
]
keywords = [
  "anomaly-detection",
  "forecasting",
  "time-series",
  "machine-learning",
  "observability",
  "data-intelligence"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed"
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "narwhals>=1.25.1",
  "joblib>=1.2",
  "tqdm>=4.64"
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.7", "plotly>=5.13"]
calendar = ["holidays>=0.11"]
interop = ["xarray>=2023.1", "polars>=1.0"]
pyod = ["pyod>=2.0"]
storage = [
  "h5py>=3.10",
  "pyarrow>=16.0"
]
darts = [
  "darts>=0.41,<0.42"
]
torch = [
  "torch>=2.2",
  "lightning>=2.2"
]
onnx = [
  "onnx>=1.16",
  "onnxruntime>=1.18"
]
ml = [
  "darts[torch]>=0.41,<0.42",
  "torch>=2.5",
  "onnx>=1.16",
  "onnxruntime>=1.18"
]
dev = [
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5"
]
release = [
  "build>=1.2",
  "docutils>=0.21.2,<0.22",
  "twine>=7.0,<8.0"
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5"
]
platform = [
  "fsspec>=2024.6",
  "pyarrow>=16.0",
  "redis>=5.0"
]

[project.urls]
Homepage = "https://www.anomx.io"
Repository = "https://github.com/theorieken/anomx"
Issues = "https://github.com/theorieken/anomx/issues"

[project.scripts]
anomx = "anomx.cli:main"

[tool.hatch.build]
# The editable local experiment may contain developer credentials.
exclude = ["/tmp.py", "/.anomx", "/artifacts"]

[tool.hatch.build.targets.wheel]
packages = ["src/anomx"]

[tool.hatch.build.targets.wheel.force-include]
"src/anomx/py.typed" = "anomx/py.typed"
"THIRD_PARTY_NOTICES.md" = "anomx/THIRD_PARTY_NOTICES.md"
"licenses/DARTS-APACHE-2.0.txt" = "anomx/licenses/DARTS-APACHE-2.0.txt"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "ANN"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
# Preserve inherited upstream docstrings/signatures/style in the attributed ports.
# Handwritten Anomx modules retain the normal strict lint profile.
"src/anomx/data/timeseries.py" = ["E501", "ANN", "SIM", "B008", "B026", "B905"]
"src/anomx/_series_utils/**/*.py" = ["E501", "ANN", "SIM", "B008", "B026", "B905"]
"src/anomx/_series_typing.py" = ["E501", "ANN", "SIM", "B008", "B026", "B905"]
"src/anomx/_series_logging.py" = ["E501", "ANN", "SIM", "B008", "B026", "B905"]
"src/anomx/config.py" = ["E501", "ANN", "SIM", "B008", "B026", "B905"]
"src/anomx/data/processing/pipeline.py" = ["E501", "ANN", "SIM", "B008", "B026", "B905"]
"src/anomx/data/processing/transformers/**/*.py" = ["E501", "ANN", "SIM", "B008", "B026", "B905"]
"src/anomx/data/processing/encoders/**/*.py" = ["E501", "ANN", "SIM", "B008", "B026", "B905"]
"src/anomx/data/processing/dtw/**/*.py" = ["E501", "ANN", "SIM", "B008", "B026", "B905"]
"src/anomx/metrics/**/*.py" = ["E501", "ANN", "SIM", "B008", "B026", "B905"]
"tests/timeseries_baseline/**/*.py" = ["E501", "ANN", "SIM", "B008", "B026", "B905"]
"tests/native_processing_metrics/**/*.py" = ["E501", "ANN", "SIM", "B008", "B026", "B905"]

[tool.mypy]
python_version = "3.11"
files = ["src/anomx"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
branch = true
source = ["anomx"]

[tool.coverage.report]
show_missing = true
skip_covered = true
